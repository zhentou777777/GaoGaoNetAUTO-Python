<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糕糕校园网自动认证</title>
<link rel="stylesheet" href="/static/style.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📶</text></svg>">
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
</div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>糕糕校园网</h1>
      <span>自动认证</span>
    </div>
  </div>

  <div class="status-pill" id="statusPill" data-state="unknown">
    <span class="pulse"></span>
    <span id="statusText">正在连接…</span>
    <span class="badge" id="statusBadge"></span>
  </div>
</header>

<main class="layout">

  <!-- ══════════════ 左：状态 + 动作 ══════════════ -->
  <section class="col-main">

    <div class="card hero">
      <div class="hero-ring" id="heroRing">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle class="ring-track" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="hero-center">
          <div class="hero-label">出口 IP</div>
          <div class="hero-value" id="heroIp">—</div>
        </div>
      </div>
      <div class="hero-meta">
        <h2 id="heroTitle">未连接校园网</h2>
        <p id="heroDesc">正在探测本机网络…</p>
        <div class="meta-grid">
          <div class="meta">
            <span class="meta-k">认证网关</span>
            <span class="meta-v title" id="mGateway">—</span>
          </div>
          <div class="meta">
            <span class="meta-k">MAC 地址</span>
            <span class="meta-v" id="mMac">—</span>
          </div>
          <div class="meta">
            <span class="meta-k">占用名额</span>
            <span class="meta-v" id="mSlot">—</span>
          </div>
          <div class="meta">
            <span class="meta-k">在线设备</span>
            <span class="meta-v" id="mDevices">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>操作</h3>
        <span class="card-hint">按用途挑一个就好</span>
      </div>
      <div class="actions">
        <button class="btn btn-primary" data-act="login">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          立即认证
          <span class="btn-sub">用已有 Token 上线</span>
        </button>
        <button class="btn" data-act="qr">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg>
          扫码登录
          <span class="btn-sub">不依赖 Token</span>
        </button>
        <button class="btn" data-act="takeover">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          抢占上线
          <span class="btn-sub">踢掉占名额的设备</span>
        </button>
        <button class="btn" data-act="devices">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          在线设备
          <span class="btn-sub">看看谁在用</span>
        </button>
        <button class="btn" data-act="logout">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          归还名额
          <span class="btn-sub">下线本机</span>
        </button>
        <button class="btn" data-act="checktoken">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/></svg>
          检查 Token
          <span class="btn-sub">只读体检</span>
        </button>
      </div>
    </div>

    <div class="card" id="devicesCard" hidden>
      <div class="card-head">
        <h3>在线设备</h3>
        <button class="link-btn" data-act="devices-refresh">刷新</button>
      </div>
      <div id="devicesList" class="device-list"></div>
      <p class="foot-hint">· 绿点是本机；黄点是其他设备。<br>· 想两台同时用：让电脑连手机热点（同一出口 IP），只认证一次。</p>
    </div>

    <div class="card log-card">
      <div class="card-head">
        <h3>运行日志</h3>
        <button class="link-btn" data-act="log-clear">清空</button>
      </div>
      <div class="log" id="log"></div>
    </div>

  </section>

  <!-- ══════════════ 右：设置 + 日志 ══════════════ -->
  <section class="col-side">

    <div class="card">
      <div class="card-head">
        <h3>设置</h3>
      </div>

      <div class="field">
        <label for="inHost">认证网关</label>
        <div class="field-row">
          <input id="inHost" type="text" spellcheck="false" placeholder="hgs.auth.yungao-tech.com">
          <input id="inPort" type="text" inputmode="numeric" class="w-port" placeholder="1110">
        </div>
        <p class="field-hint" id="hostHint">不同学校主机/端口不同。只允许已备案的网关主机。</p>
      </div>

      <div class="field">
        <label for="inPhone">要顶替的手机 IP <span class="opt">可选</span></label>
        <input id="inPhone" type="text" spellcheck="false" placeholder="留空则不自动顶替">
      </div>

      <div class="field">
        <label>账号密码 <span class="opt">填了就永久免抓包</span></label>
        <div class="field-row">
          <input id="inMobile" type="text" spellcheck="false" placeholder="云高手机号">
          <input id="inPwd" type="password" placeholder="密码">
        </div>
        <div class="field-actions">
          <button class="btn btn-sm btn-primary" data-act="account-save">登录并保存</button>
        </div>
      </div>

      <div class="field">
        <label for="inToken">Token <span class="opt">抓包获取</span></label>
        <div class="field-row">
          <input id="inToken" type="password" spellcheck="false" placeholder="粘贴 Bearer Token">
          <button class="btn btn-sm" data-act="token-save">保存</button>
        </div>
        <p class="field-hint" id="tokenHint">Token 会被 Windows DPAPI 加密后落盘。</p>
      </div>

      <div class="toggles">
        <label class="toggle">
          <input type="checkbox" id="inAutostart">
          <span class="track"><span class="knob"></span></span>
          <span class="toggle-text">
            <b>开机自动认证</b>
            <i>启动文件夹放快捷脚本，不用注册表</i>
          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="inKick">
          <span class="track"><span class="knob"></span></span>
          <span class="toggle-text">
            <b>自动顶替手机</b>
            <i>默认关闭 —— 顶掉手机会让人很困扰</i>
          </span>
        </label>
      </div>

      <div class="field-actions end">
        <button class="btn btn-sm btn-primary" data-act="settings-save">保存设置</button>
        <button class="btn btn-sm btn-danger" data-act="settings-clear">清除已保存凭据</button>
      </div>
    </div>

  </section>
</main>

<!-- ══════════════ 二维码弹层 ══════════════ -->
<div class="modal-backdrop" id="qrModal" hidden>
  <div class="modal">
    <button class="modal-close" data-act="qr-close" aria-label="关闭">×</button>
    <div class="modal-head">
      <h3>用糕糕 APP 扫一下</h3>
      <p>这条路径完全不依赖 Token，Token 失效也能用</p>
    </div>
    <div class="qr-box">
      <div class="qr-loading" id="qrLoading"><span class="spinner"></span>正在获取二维码…</div>
      <img id="qrImg" alt="扫码登录二维码" hidden>
    </div>
    <div class="qr-state" id="qrState" data-status="loading">正在获取…</div>
    <div class="modal-actions">
      <button class="btn btn-sm" data-act="qr-refresh">刷新二维码</button>
    </div>
  </div>
</div>

<!-- ══════════════ 通用确认弹层 ══════════════ -->
<div class="modal-backdrop" id="confirmModal" hidden>
  <div class="modal modal-sm">
    <div class="modal-head">
      <h3 id="confirmTitle">确认</h3>
    </div>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-sm" data-act="confirm-no">取消</button>
      <button class="btn btn-sm btn-danger" data-act="confirm-yes">确定</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/static/app.js?v=3"></script>
</body>
</html>
